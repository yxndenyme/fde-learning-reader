name: Deploy reader to Pages
on:
  push:
    branches: [main]
    paths: ['index.html', 'version.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Package only reader files
        run: |
          mkdir -p .work/site
          cp index.html version.json .nojekyll .work/site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .work/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
